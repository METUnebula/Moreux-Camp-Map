<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moreux Camp Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: habitat planning console. Map left, mission panel right; profile, close-up, safety and data under the map. Single dark theme by choice. */
  color-scheme: dark;
  --bg:#16130f;
  --panel:#201c17;
  --raise:#2a251f;
  --line:#3d352c;
  --ink:#ede5d8;
  --muted:#a69b8d;
  --accent:#86b9e0;    /* Martian sunset blue */
  --ok:#8fbf8f;
  --warn:#e6a640;
  --crit:#e5604f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font:600 30px/1.1 var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:72ch}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.coords{font:500 13px/1.4 var(--f-mono);color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.coords span{color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
h2{font:600 15px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font:500 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:transparent;color:var(--ink);border:0;border-right:1px solid var(--line);padding:6px 10px;font:500 14px/1.2 var(--f-body);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#10161c;font-weight:600}
.seg button:hover:not([aria-pressed="true"]){background:var(--raise)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{accent-color:var(--accent);width:110px}
.num{font:500 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:4ch}
.mapwrap{position:relative}
.viewport{position:relative;aspect-ratio:1852/858;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#000;cursor:crosshair;user-select:none}
.viewport.zoomed{touch-action:none;cursor:grab}
.viewport.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;width:1852px;height:858px;transform-origin:0 0}
.stage img{display:block;pointer-events:none;max-width:none}
.stage img.reg{position:absolute;left:0;top:0;width:1852px;height:858px}
.stage .inset{position:absolute;overflow:hidden}
.stage .inset img{position:absolute}
.stage svg{position:absolute;left:0;top:0;width:1852px;height:858px;overflow:visible}
.hud{position:absolute;display:flex;gap:6px;pointer-events:none}
.hud.tr{top:10px;right:10px;flex-direction:column;align-items:flex-end}
.hud.bl{left:10px;bottom:10px;align-items:flex-end;gap:12px}
.hud button{pointer-events:auto;background:rgba(22,19,15,.86);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:600 14px/1 var(--f-display);letter-spacing:.06em;padding:7px 10px;cursor:pointer;min-width:34px}
.hud button:hover{border-color:var(--accent)}
.zoomrow{display:flex;gap:6px}
.scale{background:rgba(22,19,15,.86);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:500 11px/1.2 var(--f-mono)}
.scale i{display:block;height:5px;border:1px solid var(--ink);border-top:0;margin-top:3px}
.north{background:rgba(22,19,15,.86);border:1px solid var(--line);border-radius:4px;padding:4px 7px;font:600 12px/1.1 var(--f-display);text-align:center}
.readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.readout div{background:var(--panel);padding:9px 12px;min-width:0}
.readout b{display:block;font:500 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.readout span{font:500 14px/1.3 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.readout small{display:block;color:var(--muted);font:400 12px/1.3 var(--f-body);margin-top:2px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font:600 12px/1.5 var(--f-display);letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.crit{color:var(--crit)}
.facts{display:grid;gap:8px;margin:0}
.facts div{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px}
.facts dt{font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.facts dd{margin:0}
.facts dd b{font:500 13px/1 var(--f-mono)}
.toggles{display:grid;gap:2px}
.toggles label{display:grid;grid-template-columns:18px 20px 1fr auto;gap:8px;align-items:center;padding:5px 4px;border-radius:4px;cursor:pointer}
.toggles label:hover{background:var(--raise)}
.toggles input{accent-color:var(--accent);margin:0;width:16px;height:16px}
.toggles .n{font:500 13px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.routes{display:grid;gap:8px}
.route{display:grid;grid-template-columns:6px 1fr;gap:10px;text-align:left;width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:10px 12px 10px 0;color:var(--ink);font:inherit;cursor:pointer}
.route i{border-radius:0 3px 3px 0}
.route[aria-pressed="true"]{border-color:var(--accent);background:#263039}
.route strong{font:600 17px/1.2 var(--f-display);letter-spacing:.02em}
.route em{font-style:normal;color:var(--muted);display:block;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font:500 12.5px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.stats span b{color:var(--muted);font-weight:400}
.stops{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.stops button{display:grid;grid-template-columns:22px 1fr;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:6px;color:var(--ink);font:400 13.5px/1.35 var(--f-body);cursor:pointer}
.stops button:hover{background:var(--raise)}
.stops button[aria-pressed="true"]{border-color:var(--line);background:var(--raise)}
.stops button > b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#16130f;font:600 12px/1 var(--f-mono)}
.stops small{color:var(--muted);display:block}
.stops small.flag{color:var(--warn)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.notes li{display:grid;grid-template-columns:4px 1fr;gap:10px;font-size:14px;line-height:1.4}
.notes li::before{content:"";border-radius:2px;background:var(--warn)}
.notes li.c::before{background:var(--crit)}
.notes li.i::before{background:var(--accent)}
.notes li.g::before{background:var(--ok)}
.notes li.f::before{background:var(--muted)}
.fine{color:var(--muted);font-size:13px;line-height:1.45;margin:8px 0 0}
.profhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
#prof{width:100%;height:auto;display:block;margin-top:6px}
#prof text{font:11px var(--f-mono);fill:var(--muted)}
.mk{cursor:pointer}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.chipgrid{display:grid;grid-template-columns:minmax(0,440px) minmax(220px,1fr);gap:16px;align-items:start}
.chipwrap{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#000}
.chipwrap img{position:absolute;inset:0;width:100%;height:100%;display:block}
.chipwrap svg{position:absolute;inset:0;width:100%;height:100%}
.chipinfo h3{font:600 19px/1.2 var(--f-display);letter-spacing:.02em;margin:0 0 4px;text-wrap:balance}
.chipinfo .where{font:500 12.5px/1.5 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.chipinfo p{margin:8px 0 0;font-size:14px;line-height:1.45}
.chipinfo p.flag{color:var(--warn)}
.keyrow{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.keyrow svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.pop{position:absolute;z-index:5;width:310px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 12px 13px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.pop[hidden]{display:none}
.pop h3{font:600 13px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 28px 4px 0}
.pop .where{font:500 12.5px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.pop .notes{margin-top:10px;gap:8px}
.pop .notes li{font-size:13.5px}
.pop .x{position:absolute;top:6px;right:6px;width:26px;height:26px;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--muted);font:500 18px/1 var(--f-body);cursor:pointer}
.pop .x:hover{color:var(--ink);border-color:var(--line)}
@media (max-width:1040px){.main{grid-template-columns:1fr}}
@media (max-width:620px){.readout{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}.hright{align-items:flex-start}.coords{text-align:left}.wrap{padding:16px 16px 32px}.pop{position:static;width:auto;margin-top:8px}.chipgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.stage.anim{transition:transform .35s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="hright">
      <div class="seg" id="langSeg" role="group" aria-label="Language / Dil"><button data-v="en">English</button><button data-v="tr">Türkçe</button></div>
      <div class="coords" id="hc"></div>
    </div>
  </header>

  <div class="main">
    <div class="col">
      <div class="card bar">
        <div class="grp"><span class="lbl" data-t="base"></span>
          <div class="seg" id="baseSeg">
            <button data-v="ctx" data-t="lCtx"></button><button data-v="day" data-t="lDay"></button><button data-v="night" data-t="lNight"></button><button data-v="topo" data-t="lTopo"></button>
          </div>
        </div>
        <div class="grp"><span class="lbl" data-t="overlay"></span>
          <div class="seg" id="overSeg">
            <button data-v="none" data-t="lNone"></button><button data-v="ctx" data-t="lCtx"></button><button data-v="day" data-t="lDay"></button><button data-v="night" data-t="lNight"></button><button data-v="topo" data-t="lTopo"></button>
          </div>
          <input type="range" id="opacity" min="0" max="100" value="30">
          <span class="num" id="opv"></span>
        </div>
      </div>

      <div class="mapwrap">
        <div class="viewport" id="vp">
          <div class="stage" id="stage">
            <img class="reg" id="rb" alt="">
            <div class="inset" id="ib"></div>
            <img class="reg" id="ro" alt="">
            <div class="inset" id="io"></div>
            <svg id="ov" viewBox="0 0 1852 858"></svg>
          </div>
          <div class="hud tr">
            <div class="zoomrow"><button id="zin">+</button><button id="zout">−</button></div>
            <div class="zoomrow"><button id="vCamp" data-t="vCamp"></button><button id="vCrater" data-t="vCrater"></button><button id="vAll" data-t="vAll"></button></div>
          </div>
          <div class="hud bl">
            <div class="north"><span data-t="N"></span><br>▲</div>
            <div class="scale"><span id="scl"></span><i id="sclbar"></i></div>
          </div>
        </div>
        <div class="pop" id="pop" hidden role="dialog">
          <button class="x" id="popx">×</button>
          <h3 id="popT"></h3>
          <div class="where" id="popW"></div>
          <ul class="notes" id="popN"></ul>
        </div>
      </div>

      <div class="readout">
        <div><b data-t="rPosH"></b><span id="rPos"></span><small id="rDist"></small></div>
        <div><b data-t="rElH"></b><span id="rEl">–</span><small id="rSl"></small></div>
        <div><b data-t="rThH"></b><span id="rTh">–</span><small id="rThT"></small></div>
        <div><b data-t="rClsH"></b><span id="rCls">–</span><small data-t="rClsS"></small></div>
      </div>

      <div class="card">
        <div class="profhead">
          <h2 id="profTitle" style="margin:0"></h2>
          <div class="legend">
            <span><i style="background:var(--ink)"></i><span data-t="pgElev"></span></span>
            <span><i style="background:var(--accent)"></i><span data-t="pgTherm"></span></span>
            <span><i style="background:var(--crit);height:8px;opacity:.45"></i><span data-t="pgSteep"></span></span>
          </div>
        </div>
        <svg id="prof" viewBox="0 0 900 200" role="img"></svg>
        <p class="fine" data-t="profNote"></p>
      </div>

      <div class="card">
        <h2 data-t="chipH"></h2>
        <div class="chipgrid">
          <div class="chipwrap"><img id="chipImg" alt=""><svg id="chipOv" viewBox="0 0 1000 1000"></svg></div>
          <div class="chipinfo">
            <h3 id="chipT"></h3>
            <div class="where" id="chipW"></div>
            <p id="chipN"></p>
            <p id="chipWalk"></p>
            <div class="keyrow" id="chipKey"></div>
            <p class="fine" id="chipCap"></p>
          </div>
        </div>
      </div>

      <div class="pair">
        <div class="card">
          <h2 data-t="safeH"></h2>
          <p class="fine" style="margin:0 0 10px" data-t="safeIntro"></p>
          <ul class="notes" id="safeList"></ul>
        </div>
        <div class="card">
          <h2 data-t="dataH"></h2>
          <div id="dataBody"></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2 data-t="factsH"></h2>
        <dl class="facts" id="facts"></dl>
      </div>
      <div class="card">
        <h2 data-t="layersH"></h2>
        <div class="toggles" id="tg"></div>
        <p class="fine" data-t="layersNote"></p>
      </div>
      <div class="card">
        <h2 data-t="routesH"></h2>
        <div class="grp" style="margin-bottom:10px">
          <span class="lbl" data-t="speed"></span>
          <input type="range" id="spd" min="4" max="20" value="10">
          <span class="num" id="spdv"></span>
        </div>
        <div class="routes" id="routes"></div>
        <ol class="stops" id="stops"></ol>
        <p class="fine" data-t="routesNote"></p>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
const D = window.MAP_DATA, W = D.W, H = D.H, KLAT = 59.2747, NS = 'http://www.w3.org/2000/svg', R = D.inset;
const $ = id => document.getElementById(id);
let LANG = document.documentElement.lang === 'tr' ? 'tr' : 'en';
try { const s = localStorage.getItem('moreux-lang'); if (s === 'en' || s === 'tr') LANG = s; } catch (e) {}

/* ---------- text ---------- */
const L = {

  profT:'Route profile', pgElev:'Elevation (m)', pgTherm:'Night thermal brightness (0–100)', pgSteep:'Slope above 15°',
  profNote:'Elevation is from the 200 m MOLA–HRSC elevation model, in metres relative to the Mars datum. Thermal brightness is a relative index from the THEMIS night mosaic, not a temperature.',

  kTarget:'Target', kPark:'Rover park point', kWalk:'Walk', kRoute:'Rover route', kCamp:'Camp',

function profile(r){
